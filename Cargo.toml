[package]
name = "rssite"
version = "0.1.22"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "Static site generator with a pre-declared output manifest"
license = "MIT"
repository = "https://github.com/veltzer/rssite"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
deunicode = "1"
# GitHub's :shortcode: names, for `[markdown] emoji`.
emojis = "0.9"
grass = { version = "0.13", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The HTML writer's own escaping, for the external links rssite writes itself.
pulldown-cmark-escape = "0.11"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Pure-Rust regex engine (no oniguruma C build); the bundled syntax and theme
# sets are what the fenced code blocks are highlighted with. Features are
# listed one by one rather than through default-fancy, which would also pull
# yaml-load and with it the unmaintained yaml-rust (RUSTSEC-2024-0320).
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
tera = "1"
toml = "1"
walkdir = "2"

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
